# Default values for openclaw.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "slim"

initImage:
  repository: busybox
  pullPolicy: IfNotPresent
  tag: "1.37"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 18789

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 4000m
    memory: 6Gi

nodeSelector: {}

tolerations: []

affinity: {}

# existingSecret specifies the name of a pre-existing Secret containing:
# OPENCLAW_GATEWAY_TOKEN, OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.
# In an ArgoCD environment, this is typically managed via ExternalSecrets or Vault.
existingSecret: "openclaw-secrets"

# Additional environment variables to pass to the OpenClaw container.
# E.g., for configuring LiteLLM base URLs
env: []
  # - name: OPENAI_BASE_URL
  #   value: "http://litellm-proxy.default.svc.cluster.local:4000"

# OpenClaw Gateway Configuration
# See https://docs.openclaw.ai/gateway/configuration
gatewayConfig:
  mode: "local"
  # Set to "0.0.0.0" when exposing via Kubernetes Service/Ingress
  bind: "0.0.0.0"
  port: 18789
  auth:
    mode: "token"
  controlUi:
    enabled: true

# Define persistent storage
persistence:
  enabled: true
  # storageClass: "-"
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

# Initial AGENTS.md configuration
agentsMd: |
  # OpenClaw Assistant
  
  You are a helpful AI assistant running in Kubernetes.
